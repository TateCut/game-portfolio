name: Daily stats

# Once a day, after every time zone has finished yesterday's Daily Climb:
# lock in final places, update each player's history + stats (profile page),
# and recompute trophy rarity. Run it by hand (Actions tab > Daily stats >
# Run workflow) to fill in past history; tick "rebuild" to redo every day.
on:
  schedule:
    - cron: "17 13 * * *"   # 13:17 UTC — yesterday is over everywhere by 12:00 UTC
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Redo every past day (not just new ones)"
        type: boolean
        default: false
      release_dry_run:
        description: "Only log which never-locked names would be released"
        type: boolean
        default: false
      checks_live:
        description: "Let the score check and tidy-up make changes (until switched on for good, they only log what they would do)"
        type: boolean
        default: false

concurrency:
  group: daily-stats
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/stats
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      # Re-check every closed day's results against its puzzle first (a total the words don't add up to is lowered).
      - run: node rescore.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RESCORE_DRY_RUN: ${{ github.event.inputs.checks_live == 'true' && '0' || '1' }}   # log-only until reviewed (v0.17.0)
      - run: node finalize.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          REBUILD: ${{ github.event.inputs.rebuild == 'true' && '1' || '0' }}
      # A compact copy of each finalized day's results, for the weekly leaderboard (one read instead of one per player).
      - run: node boards.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          REBUILD: ${{ github.event.inputs.rebuild == 'true' && '1' || '0' }}
      # Streak safety net: brings a streak up to date from the boards when the game couldn't (only moves forward).
      - run: node streaks.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      # Never-locked usernames (picked with no secret emoji) are released after 7 days without playing.
      - run: node release-names.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RELEASE_DRY_RUN: ${{ github.event.inputs.release_dry_run == 'true' && '1' || '0' }}
      # Half-made name claims and old move links.
      - run: node tidy.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TIDY_DRY_RUN: ${{ github.event.inputs.checks_live == 'true' && '0' || '1' }}   # log-only until reviewed (v0.17.0)
