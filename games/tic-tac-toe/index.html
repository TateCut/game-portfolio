<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic Tac Toe</title>
<style>
  :root {
    --bg: #f5f5f4;
    --surface: #ffffff;
    --line: #d6d3d1;
    --text: #1c1917;
    --muted: #78716c;
    --accent: #2563eb;
    --x: #2563eb;
    --o: #db2777;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917;
      --surface: #292524;
      --line: #44403c;
      --text: #f5f5f4;
      --muted: #a8a29e;
      --accent: #60a5fa;
      --x: #60a5fa;
      --o: #f472b6;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 32px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h1 {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .modes {
    display: flex;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 4px;
  }
  .modes button {
    border: none;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 0.875rem;
    padding: 6px 14px;
    border-radius: 7px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .modes button.active {
    background: var(--accent);
    color: #fff;
  }
  .status {
    font-size: 1rem;
    color: var(--muted);
    min-height: 1.4em;
    text-align: center;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    background: var(--line);
    border: 8px solid var(--line);
    border-radius: 14px;
    width: min(90vw, 320px);
    aspect-ratio: 1;
  }
  .cell {
    background: var(--surface);
    border: none;
    border-radius: 6px;
    font-size: clamp(2rem, 14vw, 3.5rem);
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    transition: background 0.15s;
  }
  .cell:hover:not(:disabled) { background: var(--bg); }
  .cell:disabled { cursor: default; }
  .cell.x { color: var(--x); }
  .cell.o { color: var(--o); }
  .cell.win { background: color-mix(in srgb, var(--accent) 20%, var(--surface)); }
  .scoreboard {
    display: flex;
    gap: 24px;
    font-size: 0.875rem;
    color: var(--muted);
  }
  .scoreboard b { color: var(--text); }
  .reset {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: 0.875rem;
    padding: 8px 18px;
    border-radius: 8px;
    cursor: pointer;
  }
  .reset:hover { background: var(--bg); }
  .back {
    position: fixed;
    top: 16px;
    left: 16px;
    font-size: 0.85rem;
    color: var(--muted);
    text-decoration: none;
  }
  .back:hover { color: var(--text); }
</style>
</head>
<body>
  <a class="back" href="../../index.html">&larr; Portfolio</a>
  <h1>Tic Tac Toe</h1>

  <div class="modes" id="modes">
    <button data-mode="two" class="active">Two Players</button>
    <button data-mode="ai">Vs Computer</button>
  </div>

  <div class="status" id="status">X to move</div>

  <div class="board" id="board"></div>

  <div class="scoreboard" id="scoreboard">
    <span>X <b id="scoreX">0</b></span>
    <span>Draws <b id="scoreD">0</b></span>
    <span>O <b id="scoreO">0</b></span>
  </div>

  <button class="reset" id="reset">New Game</button>

<script>
(function () {
  const WINS = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const resetBtn = document.getElementById('reset');
  const modesEl = document.getElementById('modes');
  const scoreEls = {
    X: document.getElementById('scoreX'),
    O: document.getElementById('scoreO'),
    D: document.getElementById('scoreD'),
  };

  let board, current, over, mode = 'two';
  const scores = { X: 0, O: 0, D: 0 };
  const cells = [];

  for (let i = 0; i < 9; i++) {
    const btn = document.createElement('button');
    btn.className = 'cell';
    btn.addEventListener('click', () => handleMove(i));
    boardEl.appendChild(btn);
    cells.push(btn);
  }

  function newGame() {
    board = Array(9).fill('');
    current = 'X';
    over = false;
    cells.forEach(c => {
      c.textContent = '';
      c.disabled = false;
      c.classList.remove('x', 'o', 'win');
    });
    setStatus('X to move');
  }

  function setStatus(text) {
    statusEl.textContent = text;
  }

  function handleMove(i) {
    if (over || board[i]) return;
    if (mode === 'ai' && current === 'O') return;
    place(i, current);
    if (advance()) return;
    if (mode === 'ai' && !over && current === 'O') {
      setStatus('Computer thinking…');
      setTimeout(() => {
        place(bestMove(board), 'O');
        advance();
      }, 300);
    }
  }

  function place(i, player) {
    board[i] = player;
    cells[i].textContent = player;
    cells[i].classList.add(player.toLowerCase());
    cells[i].disabled = true;
  }

  // returns true if the game ended on this move
  function advance() {
    const result = evaluate(board);
    if (result) {
      over = true;
      cells.forEach(c => c.disabled = true);
      if (result.winner === 'draw') {
        scores.D++;
        setStatus("It's a draw");
      } else {
        scores[result.winner]++;
        result.line.forEach(idx => cells[idx].classList.add('win'));
        const who = mode === 'ai'
          ? (result.winner === 'X' ? 'You win!' : 'Computer wins')
          : result.winner + ' wins';
        setStatus(who);
      }
      updateScores();
      return true;
    }
    current = current === 'X' ? 'O' : 'X';
    setStatus(nextLabel());
    return false;
  }

  function nextLabel() {
    if (mode === 'ai') return current === 'X' ? 'Your move' : 'Computer thinking…';
    return current + ' to move';
  }

  function updateScores() {
    scoreEls.X.textContent = scores.X;
    scoreEls.O.textContent = scores.O;
    scoreEls.D.textContent = scores.D;
  }

  // evaluate board -> null | {winner: 'X'|'O'|'draw', line?}
  function evaluate(b) {
    for (const line of WINS) {
      const [a, c, d] = line;
      if (b[a] && b[a] === b[c] && b[a] === b[d]) {
        return { winner: b[a], line };
      }
    }
    return b.every(Boolean) ? { winner: 'draw' } : null;
  }

  // minimax: O is maximizing (computer), X is minimizing (human)
  function bestMove(b) {
    let bestScore = -Infinity;
    let move = -1;
    for (let i = 0; i < 9; i++) {
      if (b[i]) continue;
      b[i] = 'O';
      const score = minimax(b, 0, false);
      b[i] = '';
      if (score > bestScore) {
        bestScore = score;
        move = i;
      }
    }
    return move;
  }

  function minimax(b, depth, isMax) {
    const result = evaluate(b);
    if (result) {
      if (result.winner === 'O') return 10 - depth;
      if (result.winner === 'X') return depth - 10;
      return 0;
    }
    if (isMax) {
      let best = -Infinity;
      for (let i = 0; i < 9; i++) {
        if (b[i]) continue;
        b[i] = 'O';
        best = Math.max(best, minimax(b, depth + 1, false));
        b[i] = '';
      }
      return best;
    } else {
      let best = Infinity;
      for (let i = 0; i < 9; i++) {
        if (b[i]) continue;
        b[i] = 'X';
        best = Math.min(best, minimax(b, depth + 1, true));
        b[i] = '';
      }
      return best;
    }
  }

  modesEl.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    mode = btn.dataset.mode;
    [...modesEl.children].forEach(b => b.classList.toggle('active', b === btn));
    newGame();
  });

  resetBtn.addEventListener('click', newGame);

  newGame();
  updateScores();
})();
</script>
</body>
</html>
